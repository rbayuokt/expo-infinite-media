plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.infinitemedia'
version = '0.1.0'

def media3Version = '1.11.1'
// 3.2.x is the last line built against Kotlin 2.1, which Expo 55 compiles with.
def coilVersion = '3.2.0'

android {
  namespace "expo.modules.infinitemedia"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
  implementation "androidx.media3:media3-datasource:${media3Version}"
  implementation "androidx.media3:media3-database:${media3Version}"
  implementation "io.coil-kt.coil3:coil:${coilVersion}"
  implementation "io.coil-kt.coil3:coil-network-okhttp:${coilVersion}"

  testImplementation 'junit:junit:4.13.2'
}
