<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" aria-label="What the library holds for each post around the one on screen">
  <style>
    .bg { fill: #07070B; }
    .card { fill: #16161E; stroke: #2A2A36; stroke-width: 1; }
    .live { fill: #17210C; stroke: #C8FF3D; stroke-width: 2; }
    .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .idx { fill: #9A9AA8; font-size: 15px; font-weight: 700; }
    .idx-live { fill: #C8FF3D; font-size: 15px; font-weight: 800; }
    .what { fill: #F4F4F6; font-size: 15px; }
    .what-dim { fill: #6E6E7C; font-size: 15px; }
    .tag { fill: #9A9AA8; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .tag-live { fill: #0B0B0F; font-size: 12px; font-weight: 800; letter-spacing: 1px; }
    .title { fill: #F4F4F6; font-size: 16px; font-weight: 700; }
    .sub { fill: #6E6E7C; font-size: 13px; }
  </style>

  <rect class="bg" width="780" height="470" rx="14" />
  <text class="t title" x="28" y="38">What the library is holding, post by post</text>
  <text class="t sub" x="28" y="60">A feed of 1000 posts. Only these five cost anything.</text>

  <!-- far ahead -->
  <rect class="card" x="28" y="82" width="640" height="46" rx="10" />
  <text class="t idx" x="48" y="111">#103</text>
  <text class="t what-dim" x="112" y="111">nothing yet, just an id and a url in your list</text>

  <!-- P2 -->
  <rect class="card" x="28" y="138" width="640" height="46" rx="10" />
  <text class="t idx" x="48" y="167">#102</text>
  <text class="t what" x="112" y="167">first ~1.5 MB saved to disk</text>
  <rect x="690" y="148" width="46" height="26" rx="13" fill="#2A2A36" />
  <text class="t tag" x="703" y="166">P2</text>

  <!-- P1 -->
  <rect class="card" x="28" y="194" width="640" height="46" rx="10" />
  <text class="t idx" x="48" y="223">#101</text>
  <text class="t what" x="112" y="223">player ready and paused, first frame decoded</text>
  <rect x="690" y="204" width="46" height="26" rx="13" fill="#2A2A36" />
  <text class="t tag" x="703" y="222">P1</text>

  <!-- P0, on screen -->
  <rect class="live" x="28" y="250" width="640" height="58" rx="12" />
  <text class="t idx-live" x="48" y="285">#100</text>
  <polygon points="108,275 108,291 122,283" fill="#C8FF3D" />
  <text class="t what" x="134" y="285">PLAYING, full buffer, the only audio in the app</text>
  <rect x="690" y="266" width="46" height="26" rx="13" fill="#C8FF3D" />
  <text class="t tag-live" x="702" y="284">P0</text>

  <!-- P3 -->
  <rect class="card" x="28" y="318" width="640" height="46" rx="10" />
  <text class="t idx" x="48" y="347">#99</text>
  <text class="t what" x="112" y="347">poster kept, bytes stay in the cache</text>
  <rect x="690" y="328" width="46" height="26" rx="13" fill="#2A2A36" />
  <text class="t tag" x="703" y="346">P3</text>

  <!-- behind -->
  <rect class="card" x="28" y="374" width="640" height="46" rx="10" />
  <text class="t idx" x="48" y="403">#98</text>
  <text class="t what-dim" x="112" y="403">released, its player went back to the pool</text>

  <text class="t sub" x="28" y="448">Swipe on and the whole window slides by one. Work for posts you passed is cancelled.</text>
</svg>
