<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" width="780" height="640" role="img" aria-label="Benchmark results for Android, iOS and the web: time to first frame, stall time and network traffic, on a cold and a warm cache">
  <style>
    .bg { fill: #07070B; }
    .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .title { fill: #F4F4F6; font-size: 16px; font-weight: 700; }
    .sub { fill: #6E6E7C; font-size: 12.5px; }
    .panel { fill: #F4F4F6; font-size: 13px; font-weight: 700; }
    .unit { fill: #6E6E7C; font-size: 11.5px; }
    .row { fill: #9A9AA8; font-size: 12px; }
    .val { fill: #F4F4F6; font-size: 12px; font-weight: 700; }
    .axis { stroke: #2A2A36; stroke-width: 1; }
    .legend { fill: #9A9AA8; font-size: 12px; }
  </style>

  <rect class="bg" width="780" height="640" rx="14" />
  <text class="t title" x="24" y="34">One 60 second run, 1200 items, release builds</text>
  <text class="t sub" x="24" y="54">OPPO Reno5 F on Android 13, iPhone 11 Pro on iOS 26.2, Chrome 155 on an M3 Pro. Same media. Lower is better.</text>

  <rect x="470" y="24" width="10" height="10" rx="3" fill="#6F9A1C" />
  <text class="t legend" x="486" y="33">Android</text>
  <rect x="575" y="24" width="10" height="10" rx="3" fill="#6F5BE0" />
  <text class="t legend" x="591" y="33">iOS</text>
  <rect x="652" y="24" width="10" height="10" rx="3" fill="#D08A2C" />
  <text class="t legend" x="668" y="33">Web</text>

  <text class="t panel" x="24" y="96">Time to first frame, p90</text>
  <text class="t unit" x="196" y="96">milliseconds after landing on a post. A warm run lands on a prepared frame everywhere.</text>
  <text class="t row" x="24" y="122">Android, cold</text>
  <rect x="130" y="110" width="4" height="16" rx="2.0" fill="#6F9A1C" />
  <text class="t val" x="142" y="123">1</text>
  <text class="t row" x="24" y="146">Android, warm</text>
  <rect x="130" y="134" width="4" height="16" rx="2.0" fill="#6F9A1C" />
  <text class="t val" x="142" y="147">1</text>
  <text class="t row" x="24" y="170">iOS, cold</text>
  <rect x="130" y="158" width="22" height="16" rx="4" fill="#6F5BE0" />
  <text class="t val" x="160" y="171">5</text>
  <text class="t row" x="24" y="194">iOS, warm</text>
  <rect x="130" y="182" width="3" height="16" rx="1.5" fill="#6F5BE0" />
  <text class="t val" x="141" y="195">0</text>
  <text class="t row" x="24" y="218">Web, cold</text>
  <rect x="130" y="206" width="520" height="16" rx="4" fill="#D08A2C" />
  <text class="t val" x="658" y="219">116</text>
  <text class="t row" x="24" y="242">Web, warm</text>
  <rect x="130" y="230" width="4" height="16" rx="2.0" fill="#D08A2C" />
  <text class="t val" x="142" y="243">1</text>
  <line class="axis" x1="130" y1="104" x2="130" y2="248" />

  <text class="t panel" x="24" y="302">Stall time in the minute</text>
  <text class="t unit" x="192" y="302">milliseconds, every rebuffer on the post you are watching, added up.</text>
  <text class="t row" x="24" y="328">Android, cold</text>
  <rect x="130" y="316" width="3" height="16" rx="1.5" fill="#6F9A1C" />
  <text class="t val" x="141" y="329">0</text>
  <text class="t row" x="24" y="352">Android, warm</text>
  <rect x="130" y="340" width="3" height="16" rx="1.5" fill="#6F9A1C" />
  <text class="t val" x="141" y="353">0</text>
  <text class="t row" x="24" y="376">iOS, cold</text>
  <rect x="130" y="364" width="520" height="16" rx="4" fill="#6F5BE0" />
  <text class="t val" x="658" y="377">494</text>
  <text class="t row" x="24" y="400">iOS, warm</text>
  <rect x="130" y="388" width="3" height="16" rx="1.5" fill="#6F5BE0" />
  <text class="t val" x="141" y="401">0</text>
  <text class="t row" x="24" y="424">Web, cold</text>
  <rect x="130" y="412" width="162" height="16" rx="4" fill="#D08A2C" />
  <text class="t val" x="300" y="425">154</text>
  <text class="t row" x="24" y="448">Web, warm</text>
  <rect x="130" y="436" width="15" height="16" rx="4" fill="#D08A2C" />
  <text class="t val" x="153" y="449">14</text>
  <line class="axis" x1="130" y1="310" x2="130" y2="454" />

  <text class="t panel" x="24" y="508">Pulled over the network</text>
  <text class="t unit" x="190" y="508">megabytes, playback and preload together. Browsers hide this for cross origin media.</text>
  <text class="t row" x="24" y="534">Android, cold</text>
  <rect x="130" y="522" width="520" height="16" rx="4" fill="#6F9A1C" />
  <text class="t val" x="658" y="535">131.7</text>
  <text class="t row" x="24" y="558">Android, warm</text>
  <rect x="130" y="546" width="17" height="16" rx="4" fill="#6F9A1C" />
  <text class="t val" x="155" y="559">4.4</text>
  <text class="t row" x="24" y="582">iOS, cold</text>
  <rect x="130" y="570" width="422" height="16" rx="4" fill="#6F5BE0" />
  <text class="t val" x="560" y="583">106.8</text>
  <text class="t row" x="24" y="606">iOS, warm</text>
  <rect x="130" y="594" width="3" height="16" rx="1.5" fill="#6F5BE0" />
  <text class="t val" x="141" y="607">0.0</text>
  <line class="axis" x1="130" y1="516" x2="130" y2="612" />
</svg>
